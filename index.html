<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A question for you</title>
<style>
  /* 1. COLORS live in variables so you can re-theme in one place */
  :root {
    --bg: #ffe3ea;
    --card: #fff8fa;
    --ink: #4a1633;
    --accent: #d6336c;
    --soft: #f3b6c8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", sans-serif; padding: 16px;
  }
  .card {
    width: min(420px, 100%); background: var(--card);
    border-radius: 24px; padding: 28px 24px; text-align: center;
    box-shadow: 0 10px 30px rgba(214, 51, 108, .18);
  }
  h1 { font-size: 1.6rem; margin: 0 0 16px; }
  p { margin: 0 0 16px; }
  button, select, input {
    font: inherit; border-radius: 999px; border: 2px solid var(--soft);
    padding: 12px 20px; margin: 6px 4px; background: #fff; color: var(--ink);
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.choice.picked { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* 2. STEPS: every step is a <section>. Only the one with .active is shown */
  .step { display: none; }
  .step.active { display: block; animation: pop .35s ease; }
  @keyframes pop { from { transform: scale(.95); opacity: 0; } to { transform: none; opacity: 1; } }

  /* The ticket at the end */
  #pass { border: 2px dashed var(--accent); border-radius: 16px; padding: 16px; margin: 16px 0; background: #fff; text-align: left; }
  #pass img { width: 100%; border-radius: 12px; margin-top: 8px; }
  #no { position: relative; }
</style>
</head>
<body>
<main class="card">

  <!-- STEP 0: the question -->
  <section class="step active" id="s0">
    <h1>Will you go on a date with me? 💌</h1>
    <button class="primary" onclick="next()">Yes 💖</button>
    <button id="no">No 🙈</button>
  </section>

  <!-- STEP 1: reaction -->
  <section class="step">
    <h1>Really?! 😳</h1>
    <p>I'm so happy. Let's plan it.</p>
    <button class="primary" onclick="next()">Next</button>
  </section>

  <!-- STEP 2: pick a date and time -->
  <section class="step">
    <h1>When are you free? 📅</h1>
    <input type="datetime-local" id="when">
    <p></p>
    <button class="primary" onclick="saveDate()">Next</button>
  </section>

  <!-- STEP 3: choose food. data-key says which pass field it fills -->
  <section class="step" data-key="food">
    <h1>What shall we eat? 🍜</h1>
    <button class="choice">Sushi 🍣</button>
    <button class="choice">Burgers 🍔</button>
    <button class="choice">Hot pot 🍲</button>
    <button class="choice">Ramen 🍜</button>
    <button class="choice">Dessert 🍨</button>
    <p></p>
    <button class="primary" onclick="next()">Next</button>
  </section>

  <!-- STEP 4: choose activity -->
  <section class="step" data-key="activity">
    <h1>Where after dinner? 🎡</h1>
    <button class="choice">Movie 🎬</button>
    <button class="choice">A walk 🌳</button>
    <button class="choice">Spa 💅</button>
    <button class="choice">Theme park 🎡</button>
    <p></p>
    <button class="primary" onclick="finish()">Done</button>
  </section>

  <!-- STEP 5: the date pass -->
  <section class="step">
    <h1>It's a date! ❤️</h1>
    <div id="pass">
      <strong>DATE PASS</strong>
      <p>📅 <span id="p-when">-</span></p>
      <p>🍜 <span id="p-food">-</span></p>
      <p>✨ <span id="p-activity">-</span></p>
      <!-- Put your own photo.jpg next to index.html -->
      <img src="photo.jpg" alt="Our photo" onerror="this.remove()">
    </div>
    <button class="primary" onclick="savePass()">Save pass 📥</button>
  </section>

</main>

<!-- Library that turns the pass into an image -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  // 3. LOGIC: show one step at a time
  const steps = [...document.querySelectorAll('.step')];
  let current = 0;
  const choices = {};          // remembers what was picked, e.g. {food: "Sushi 🍣"}

  function go(i) {
    steps[current].classList.remove('active');
    current = i;
    steps[current].classList.add('active');
  }
  function next() { go(current + 1); }

  // Clicking a choice button highlights it and stores the answer
  document.querySelectorAll('.choice').forEach(btn => {
    btn.addEventListener('click', () => {
      const step = btn.closest('.step');
      step.querySelectorAll('.choice').forEach(b => b.classList.remove('picked'));
      btn.classList.add('picked');
      choices[step.dataset.key] = btn.textContent;
    });
  });

  function saveDate() {
    const v = document.getElementById('when').value;
    if (!v) { alert('Please pick a date and time first 🙂'); return; }
    choices.when = new Date(v).toLocaleString([], { dateStyle: 'full', timeStyle: 'short' });
    next();
  }

  function finish() {
    document.getElementById('p-when').textContent = choices.when || '-';
    document.getElementById('p-food').textContent = choices.food || 'Surprise me';
    document.getElementById('p-activity').textContent = choices.activity || 'Surprise me';
    next();
  }

  // 4. The fun part: the "No" button dodges the cursor/finger
  const no = document.getElementById('no');
  function dodge() {
    const x = Math.random() * 160 - 80, y = Math.random() * 120 - 60;
    no.style.left = x + 'px'; no.style.top = y + 'px';
  }
  no.addEventListener('mouseover', dodge);
  no.addEventListener('touchstart', e => { e.preventDefault(); dodge(); });

  // 5. Save the pass as a PNG image
  function savePass() {
    html2canvas(document.getElementById('pass')).then(canvas => {
      const a = document.createElement('a');
      a.download = 'date-pass.png';
      a.href = canvas.toDataURL();
      a.click();
    });
  }
</script>
</body>
</html>
